[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mewcode"
version = "0.1.0"
description = "终端 AI 对话助手"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40,<1",
  "openai>=1.60,<3",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "rich>=14.2,<15",
  "textual>=8.2,<9",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mewcode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
